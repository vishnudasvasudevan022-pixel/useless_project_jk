<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Liquid Weather 💧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Dark Mode Palette (Default - Sleek Light-Dark Blue) */
      --sky-1: #090f1d;
      --sky-2: #14213d;
      --sky-3: #1f355b;

      --glass-bg: rgba(20, 33, 61, 0.45);
      --glass-card: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-subtle: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      --glass-highlight: rgba(255, 255, 255, 0.08);

      --orb-1: rgba(31, 53, 91, 0.55);
      --orb-2: rgba(43, 84, 146, 0.35);
      --orb-3: rgba(14, 26, 49, 0.8);

      --txt-main: #f0f4fc;
      --txt-sub: #94a3b8;

      --yes-bg: rgba(16, 185, 129, 0.28);
      --yes-border: rgba(16, 185, 129, 0.55);
      --yes-glow: rgba(16, 185, 129, 0.35);

      --no-bg: rgba(239, 68, 68, 0.28);
      --no-border: rgba(239, 68, 68, 0.55);
      --no-glow: rgba(239, 68, 68, 0.35);

      --btn-start-bg: rgba(255, 255, 255, 0.12);
      --btn-start-border: rgba(255, 255, 255, 0.22);
    }

    /* Light Mode Palette */
    [data-theme="light"] {
      --sky-1: #1e3c72;
      --sky-2: #2a5298;
      --sky-3: #3b6cb0;

      --glass-bg: rgba(255, 255, 255, 0.2);
      --glass-card: rgba(255, 255, 255, 0.22);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-border-subtle: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 16px 40px rgba(10, 25, 60, 0.25);
      --glass-highlight: rgba(255, 255, 255, 0.25);

      --orb-1: rgba(100, 160, 240, 0.45);
      --orb-2: rgba(130, 200, 250, 0.35);
      --orb-3: rgba(42, 82, 152, 0.5);

      --txt-main: #ffffff;
      --txt-sub: #e2e8f0;

      --yes-bg: rgba(34, 197, 94, 0.4);
      --yes-border: rgba(34, 197, 94, 0.7);
      --yes-glow: rgba(34, 197, 94, 0.4);

      --no-bg: rgba(244, 63, 94, 0.4);
      --no-border: rgba(244, 63, 94, 0.7);
      --no-glow: rgba(244, 63, 94, 0.4);

      --btn-start-bg: rgba(255, 255, 255, 0.25);
      --btn-start-border: rgba(255, 255, 255, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #05070e;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ── DESKTOP/CONTAINER WRAPPER FOR MOBILE PRESENTATION ── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 50%, #0d1527 0%, #050811 100%);
    }

    /* ── MOBILE PHONE FRAME ── */
    .mobile-frame {
      width: 100%;
      max-width: 412px;
      height: 100%;
      max-height: 870px;
      aspect-ratio: 9 / 19.5;
      background: radial-gradient(circle at 50% 15%, var(--sky-3) 0%, var(--sky-2) 45%, var(--sky-1) 100%);
      color: var(--txt-main);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      border-radius: 46px;
      box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.75), 0 0 0 10px rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      transition: background 0.8s ease;
    }

    /* Fullscreen on actual mobile phones */
    @media (max-width: 480px) {
      body {
        background: transparent;
      }
      .mobile-frame {
        max-width: 100vw;
        max-height: 100dvh;
        height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    /* ── MOBILE STATUS BAR (NATIVE LOOK) ── */
    .status-bar {
      height: 44px;
      padding: 10px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--txt-main);
      z-index: 40;
      opacity: 0.9;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    /* ── TOP HEADER / THEME TOGGLE ── */
    .top-bar {
      height: 52px;
      padding: 4px 22px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.8px;
      color: var(--txt-sub);
      text-transform: uppercase;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      color: var(--txt-main);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), background 0.3s;
    }
    .theme-toggle:active {
      transform: scale(0.88) rotate(15deg);
    }

    /* ── LIQUID ORB AMBIENCE ── */
    .orb-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      transition: background 0.8s ease, transform 1s ease;
    }

    .orb-1 {
      width: 260px;
      height: 260px;
      background: var(--orb-1);
      top: -40px;
      left: -40px;
      animation: float-1 14s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 290px;
      height: 290px;
      background: var(--orb-2);
      bottom: -60px;
      right: -60px;
      animation: float-2 18s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 200px;
      height: 200px;
      background: var(--orb-3);
      top: 40%;
      left: 20%;
      animation: float-3 16s ease-in-out infinite alternate;
    }

    @keyframes float-1 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 45px) scale(1.15); }
    }
    @keyframes float-2 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-40px, -30px) scale(1.1); }
    }
    @keyframes float-3 {
      0%   { transform: translate(0, 0) scale(0.9); }
      100% { transform: translate(-20px, 30px) scale(1.2); }
    }

    /* ── SCREEN WRAPPER ── */
    .content-area {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 20px 20px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px) scale(0.97);
      transition: opacity 0.35s cubic-bezier(.4,0,.2,1), transform 0.35s cubic-bezier(.4,0,.2,1);
      z-index: 10;
    }

    .screen.active {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0) scale(1);
    }

    /* ── LIQUID GLASS CARD ── */
    .glass-card {
      background: var(--glass-card);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      border-radius: 32px;
      box-shadow: var(--glass-shadow);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
    }

    /* ── HOME SCREEN ── */
    .home-glow-icon {
      font-size: 82px;
      margin-bottom: 16px;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.35));
      animation: pulse-icon 3.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-icon {
      0%   { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.05); }
    }

    h1.title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 10px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.25);
    }

    p.subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--txt-sub);
      line-height: 1.5;
      max-width: 250px;
    }

    /* ── QUIZ SCREEN ── */
    #qEmoji {
      font-size: 72px;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
      animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    #qText {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
      min-height: 75px;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    #typewriter {
      border-right: 2.5px solid var(--txt-main);
      animation: blink 0.75s infinite;
      padding-right: 2px;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    /* ── BOTTOM CONTROLS & ULTRA-WIDE BUTTONS ── */
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      height: 68px;
      flex-shrink: 0;
    }

    .btn-action {
      flex: 1;
      height: 100%;
      border-radius: 22px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #ffffff;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 22px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s, background 0.3s;
    }

    .btn-action:active {
      transform: scale(0.94);
    }

    .btn-yes {
      background: var(--yes-bg);
      border-color: var(--yes-border);
      box-shadow: 0 8px 24px var(--yes-glow);
    }

    .btn-no {
      background: var(--no-bg);
      border-color: var(--no-border);
      box-shadow: 0 8px 24px var(--no-glow);
    }

    /* Ultra-wide bottom buttons (more width compared to height) */
    .btn-wide {
      width: 100%;
      height: 64px;
      background: var(--btn-start-bg);
      border: 1px solid var(--btn-start-border);
      border-radius: 22px;
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), background 0.3s;
    }

    .btn-wide:active {
      transform: scale(0.95);
    }

    /* ── RESULT SCREEN ── */
    .result-emoji {
      font-size: 96px;
      margin-bottom: 12px;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.35));
      transform: scale(0);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .result-emoji.pop {
      transform: scale(1);
    }

    #resTitle {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    #resDesc {
      font-size: 15px;
      font-weight: 600;
      color: var(--txt-sub);
      line-height: 1.5;
      max-width: 250px;
    }

    /* ── NATIVE BOTTOM HOME GESTURE BAR ── */
    .home-bar {
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }

    .home-indicator {
      width: 130px;
      height: 4.5px;
      background: var(--txt-main);
      opacity: 0.3;
      border-radius: 99px;
    }
  </style>
</head>
<body>

  <!-- MOBILE APP FRAME -->
  <div class="mobile-frame">

    <!-- Ambient Liquid Background Orbs -->
    <div class="orb-container">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- Mobile Native Status Bar -->
    <div class="status-bar">
      <span id="currentTime">9:41</span>
      <div class="status-icons">
        <span>5G</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <!-- App Top Bar (Brand + Dark/Light Mode Toggle) -->
    <div class="top-bar">
      <div class="app-brand">
        <div class="brand-dot"></div>
        <span>Liquid Weather</span>
      </div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle Theme">
        ☀️
      </button>
    </div>

    <!-- Main Mobile Content Area -->
    <div class="content-area">

      <!-- 1. HOME SCREEN -->
      <div class="screen active" id="home">
        <div class="glass-card">
          <div class="home-glow-icon">🔮</div>
          <h1 class="title">Weather Guesser</h1>
          <p class="subtitle">The ultimate useless weather detector. Ask the sky directly.</p>
        </div>
        <button class="btn-wide" onclick="startQuiz()">
          <span>Ask Current Weather</span> 🌤️
        </button>
      </div>

      <!-- 2. QUIZ SCREEN -->
      <div class="screen" id="quiz">
        <div class="glass-card">
          <div id="qEmoji">🚶</div>
          <div id="qText"><span id="typewriter"></span></div>
        </div>
        <div class="controls">
          <button class="btn-action btn-yes" onclick="answer(true)">
            <span>YES</span> ✨
          </button>
          <button class="btn-action btn-no" onclick="answer(false)">
            <span>NO</span> ❌
          </button>
        </div>
      </div>

      <!-- 3. RESULT SCREEN -->
      <div class="screen" id="result">
        <div class="glass-card">
          <div class="result-emoji" id="resEmoji">🌈</div>
          <div id="resTitle">Checking...</div>
          <div id="resDesc">Gathering sky data...</div>
        </div>
        <button class="btn-wide" onclick="restart()">
          <span>Ask Again</span> 🔄
        </button>
      </div>

    </div>

    <!-- Mobile Native Home Indicator -->
    <div class="home-bar">
      <div class="home-indicator"></div>
    </div>

  </div>

  <script>
    let currentTheme = 'dark';
    let step = 0;
    let typingInterval;
    const typeSpan = document.getElementById('typewriter');
    const qEmoji = document.getElementById('qEmoji');
    const themeBtn = document.getElementById('themeToggle');
    const root = document.documentElement;

    // Real-time clock for mobile status bar
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      const timeStr = hours + ':' + minutes;
      const clockEl = document.getElementById('currentTime');
      if (clockEl) clockEl.textContent = timeStr;
    }
    updateClock();
    setInterval(updateClock, 30000);

    // Weather Gradients for Dark and Light modes
    const themeGradients = {
      dark: {
        default: ['#090f1d', '#14213d', '#1f355b'],
        rain:    ['#08121f', '#102238', '#1a365d'],
        snow:    ['#0f172a', '#1e293b', '#334155'],
        sun:     ['#1a0f0a', '#381e0f', '#5e3215'],
        cloud:   ['#0f172a', '#1b2234', '#2d3748'],
        wind:    ['#081926', '#0f2e42', '#184968'],
        fog:     ['#111827', '#1f2937', '#374151'],
        alert:   ['#1f0a0e', '#3b1219', '#5c1d28']
      },
      light: {
        default: ['#1e3c72', '#2a5298', '#3b6cb0'],
        rain:    ['#1f2937', '#2563eb', '#3b82f6'],
        snow:    ['#334155', '#475569', '#64748b'],
        sun:     ['#c2410c', '#ea580c', '#f97316'],
        cloud:   ['#334155', '#475569', '#64748b'],
        wind:    ['#0284c7', '#0369a1', '#075985'],
        fog:     ['#374151', '#4b5563', '#6b7280'],
        alert:   ['#991b1b', '#b91c1c', '#dc2626']
      }
    };

    let currentWeatherTheme = 'default';

    function applyGradient(weatherKey) {
      const mode = currentTheme;
      const palette = themeGradients[mode][weatherKey] || themeGradients[mode].default;
      root.style.setProperty('--sky-1', palette[0]);
      root.style.setProperty('--sky-2', palette[1]);
      root.style.setProperty('--sky-3', palette[2]);
    }

    function toggleTheme() {
      if (currentTheme === 'dark') {
        currentTheme = 'light';
        root.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        currentTheme = 'dark';
        root.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀️';
      }
      applyGradient(currentWeatherTheme);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function typeCharByChar(text, emoji) {
      clearInterval(typingInterval);
      typeSpan.textContent = '';
      qEmoji.textContent = emoji;

      // Pop animation reset
      qEmoji.style.animation = 'none';
      qEmoji.offsetHeight;
      qEmoji.style.animation = 'popIn 0.35s cubic-bezier(.34,1.56,.64,1)';

      let i = 0;
      typingInterval = setInterval(() => {
        typeSpan.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(typingInterval);
      }, 26);
    }

    function startQuiz() {
      step = 0;
      currentWeatherTheme = 'default';
      applyGradient('default');
      showScreen('quiz');
      askCurrentQuestion();
    }

    function restart() {
      document.getElementById('resEmoji').classList.remove('pop');
      currentWeatherTheme = 'default';
      applyGradient('default');
      showScreen('home');
    }

    function finish(emoji, title, desc, weatherKey) {
      currentWeatherTheme = weatherKey;
      applyGradient(weatherKey);

      document.getElementById('resEmoji').textContent = emoji;
      document.getElementById('resTitle').textContent = title;
      document.getElementById('resDesc').textContent = desc;

      showScreen('result');
      setTimeout(() => {
        document.getElementById('resEmoji').classList.add('pop');
      }, 60);
    }

    // ── QUIZ LOGIC TREE ──
    function askCurrentQuestion() {
      if (step === 0) {
        typeCharByChar("Are you outside right now?", "🚶");
      }
      else if (step === 0.5) {
        typeCharByChar("Can you see the sky through a window?", "🪟");
      }
      else if (step === 'block') {
        finish("🚪", "Open a Window!", "I literally cannot sense weather through concrete walls.", "alert");
      }
      else if (step === 1) {
        typeCharByChar("Is water falling from the sky?", "💧");
      }
      else if (step === 2) {
        typeCharByChar("Is there snow falling or on the ground?", "❄️");
      }
      else if (step === 3) {
        typeCharByChar("Is the sun blindingly bright today?", "☀️");
      }
      else if (step === 4) {
        typeCharByChar("Are there a bunch of clouds in the sky?", "☁️");
      }
      else if (step === 5) {
        typeCharByChar("Is the wind blowing noticeably hard?", "💨");
      }
      else if (step === 6) {
        typeCharByChar("Is it completely foggy or misty?", "🌫️");
      }
    }

    function answer(isYes) {
      if (step === 0) {
        if (isYes) step = 1; else step = 0.5;
        askCurrentQuestion(); return;
      }
      if (step === 0.5) {
        if (isYes) step = 1; else step = 'block';
        askCurrentQuestion(); return;
      }
      if (step === 1) {
        if (isYes) { finish("🌧️", "It's Raining!", "Grab an umbrella or prepare to be soaked.", "rain"); return; }
        else step = 2;
        askCurrentQuestion(); return;
      }
      if (step === 2) {
        if (isYes) { finish("🌨️", "It's Snowing!", "Time for a jacket and warm coffee.", "snow"); return; }
        else step = 3;
        askCurrentQuestion(); return;
      }
      if (step === 3) {
        if (isYes) { finish("😎", "It's Sunny!", "Put on your sunglasses and enjoy the sunshine.", "sun"); return; }
        else step = 4;
        askCurrentQuestion(); return;
      }
      if (step === 4) {
        if (isYes) { finish("🌥️", "It's Cloudy!", "Overcast and gloomy, but at least dry.", "cloud"); return; }
        else step = 5;
        askCurrentQuestion(); return;
      }
      if (step === 5) {
        if (isYes) { finish("🍃", "It's Windy!", "Hold onto your hat, it's breezy out there.", "wind"); return; }
        else step = 6;
        askCurrentQuestion(); return;
      }
      if (step === 6) {
        if (isYes) { finish("🌁", "It's Foggy!", "Low visibility. Mystery movie aesthetic.", "fog"); return; }
        else finish("🌌", "Mild & Clear", "The sky is calm and completely unbothered.", "default");
      }
    }

    // Initialize Default Dark Blue Gradient
    applyGradient('default');
  </script>
